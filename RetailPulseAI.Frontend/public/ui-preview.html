<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RetailPulseAI UI Preview</title>
  <style>
    body{font-family:Inter,Arial;margin:0;background:#f8fafc;color:#0f172a}
    .wrap{max-width:1100px;margin:20px auto;padding:0 16px}
    .head{background:linear-gradient(135deg,#1d4ed8,#0891b2);color:#fff;padding:18px;border-radius:12px}
    .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
    .card{background:#fff;border:1px solid #dbe3ee;border-radius:10px;padding:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>RetailPulseAI Control Center</h1><p>Dashboard + Market Analytics + AI Insights</p></div>
    <div class="row">
      <div class="card"><h3>Total Revenue</h3><p>$1,245,320</p></div>
      <div class="card"><h3>Total Units</h3><p>452,113</p></div>
      <div class="card"><h3>Growth %</h3><p>5.8%</p></div>
      <div class="card"><h3>Market Share %</h3><p>14.3%</p></div>
    </div>
  </div>
</body>
</html>
