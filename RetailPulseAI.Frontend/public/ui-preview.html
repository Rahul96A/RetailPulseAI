<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RetailPulseAI MUI Preview</title>
  <style>
    body{margin:0;font-family:Inter,Arial;background:#f4f7fb;color:#10243e}
    .appbar{height:64px;background:#fff;box-shadow:0 1px 4px rgba(16,36,62,.12);display:flex;align-items:center;padding:0 20px;position:sticky;top:0}
    .shell{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 64px)}
    .drawer{background:#fff;border-right:1px solid #e2e8f0;padding:16px}
    .chip{margin-left:auto;background:#1565c0;color:#fff;padding:6px 12px;border-radius:16px;font-size:12px}
    .menu{padding:10px;border-radius:10px;background:#e8f0fe;margin-bottom:8px}
    .main{padding:20px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;transition:.2s}
    .card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.08)}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.drawer{display:none}.grid{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="appbar"><strong>RetailPulseAI Control Center</strong><span class="chip">Role: Analyst</span></div>
  <div class="shell">
    <aside class="drawer"><div class="menu">Dashboard</div><div>Market Analytics</div><div style="margin-top:10px">AI Insights</div></aside>
    <main class="main">
      <h2>Dashboard Overview</h2>
      <div class="grid">
        <div class="card"><small>Total Revenue</small><h3>$1,245,320</h3></div>
        <div class="card"><small>Total Units</small><h3>452,113</h3></div>
        <div class="card"><small>Growth %</small><h3>5.8%</h3></div>
        <div class="card"><small>Market Share %</small><h3>14.3%</h3></div>
      </div>
    </main>
  </div>
</body>
</html>
